# Jednorazowe przeliczenie starych drzew bieżącym ewaluatorem (#48) i wznowienie pętli. Do usunięcia po użyciu.
#   gh workflow run przelicz.yml            # drzewa 1-4 (zmienna DRZEWA w .github/loop/przelicz.sh)
name: przelicz

on:
  workflow_dispatch:

concurrency:
  group: przelicz
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  przelicz:
    if: vars.AUTOPILOT == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/loop/przelicz.sh
